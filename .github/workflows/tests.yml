name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Les macros sqlx de l'exemple openapi utilisent le cache `.sqlx` plutôt qu'une base live
  SQLX_OFFLINE: "true"

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Les tests qui demandent une base PostgreSQL / PostGIS live sont `#[ignore]` et ne tournent
      # jamais ici : ne pas passer `--ignored` ni `--include-ignored`, ils s'arrêtent d'eux-mêmes
      # quand `CI` est défini (GitHub Actions le définit)
      - name: Run tests
        run: cargo test --workspace --locked
