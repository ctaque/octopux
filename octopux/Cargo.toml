[package]
name = "octopux"
version.workspace = true
edition.workspace = true
description = "Generate JSON REST APIs for Actix with minimal boilerplate"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["actix", "crud", "rest", "api", "openapi"]
categories = ["web-programming::http-server", "database"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Derive macros, re-exported so that depending on octopux is enough
octopux-derive.workspace = true
actix-web.workspace = true
anyhow.workspace = true
async-trait.workspace = true
# Deserializes the path parameters of the generated handlers
serde.workspace = true
serde_json.workspace = true
# The internal errors of the generated handlers, logged instead of sent to the client
log = "0.4"
apistos = { workspace = true, optional = true }
# The schema of the PostGIS geometries in the OpenAPI document, the fork of schemars apistos uses
schemars = { workspace = true, optional = true }
# Queries of the `SqlxModel`, `SqlxNewModel` and `SqlxUpdatableModel` derives, the database drivers
# and the runtime are the ones the application enables on its own sqlx dependency
sqlx = { version = "0.9", default-features = false, features = ["chrono"], optional = true }
# `created_at`, `updated_at` and `deleted_at` of the sqlx derives
chrono = { workspace = true, optional = true }
# Conversions of the PostGIS geometries to and from the types of the `geo` ecosystem
geo-types = { version = "0.7", optional = true }
# The GraphQL scalars of the PostGIS geometries and of the pgvector vectors
async-graphql = { version = "7", default-features = false, optional = true }

[features]
openapi = ["dep:apistos", "dep:schemars"]
sqlx = ["dep:sqlx", "dep:chrono"]
# The PostGIS `geometry` and `geography` columns, read and written by the sqlx derives on PostgreSQL
postgis = ["sqlx", "sqlx/postgres", "dep:geo-types"]
# The pgvector `vector`, `halfvec` and `sparsevec` columns, and the similarity search of `SqlxFilter`
pgvector = ["sqlx", "sqlx/postgres"]
# With `postgis` or `pgvector`, the geometries and the vectors are GraphQL scalars (async-graphql), as in the REST routes
graphql = ["dep:async-graphql"]

[dev-dependencies]
apistos.workspace = true
async-graphql.workspace = true
schemars.workspace = true
chrono.workspace = true

# MySQL, to type check the MySQL queries of the sqlx derives
sqlx = { workspace = true, features = ["mysql"] }

[[test]]
name = "openapi"
required-features = ["openapi"]

[[test]]
name = "sqlx"
required-features = ["sqlx"]

# Needs a live PostgreSQL database with PostGIS: ignored by `cargo test` and skipped in the CI,
# run with `cargo test -p octopux --features postgis --test postgis -- --ignored`
[[test]]
name = "postgis"
required-features = ["postgis"]

# The GraphQL scalars of the geometries, in a schema, without database
[[test]]
name = "graphql_postgis"
required-features = ["postgis", "graphql"]

# Needs a live PostgreSQL database with pgvector: ignored by `cargo test` and skipped in the CI,
# run with `cargo test -p octopux --features pgvector --test pgvector -- --ignored`
[[test]]
name = "pgvector"
required-features = ["pgvector"]

# The GraphQL scalars of the vectors, in a schema, without database
[[test]]
name = "graphql_pgvector"
required-features = ["pgvector", "graphql"]
